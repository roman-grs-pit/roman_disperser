# Unified prism image builder configuration
#
# Disperses both stars and galaxies from the unified Parquet+Zarr catalog.
#
# Usage (batch mode):
#   pixi run -e cuda python scripts/build_dispersed_image.py \
#       --config this_file.yaml --pointings pointings.ecsv
#
# The pointing list is supplied separately as an ECSV file (APT format).
# This config file contains simulation parameters and data paths only.

# -- Output -----------------------------------------------------------------
# Top-level output directory.  Each pointing creates a subdirectory named
# {ecsv_basename}_{plan}.{pass}.{segment}.{observation}.{visit}.{exposure}/
output_dir: output/prism-fields

# -- RNG seed (required) ----------------------------------------------------
# Integer seed for reproducible Poisson noise.  Combined with the pointing
# filename and APT identifiers to derive per-pointing keys, so results are
# deterministic and independent of pointing order or slicing.
seed: 42

# -- Dispersing element -------------------------------------------------------
# "grism" (G150, orders 0/1/2, 0.9-2.0 um — the default) or
# "prism" (P127, order 1, 0.75-1.85 um).  Also selects the default
# optical-model YAML and sensitivity directory, and which BANDPASS rows of
# the pointing ECSV are processed (GRISM / PRISM).  The optical model is
# validated against the element at load time; a mismatch raises.
element: prism

# -- Output filename prefix (optional) ---------------------------------------
# Leading tag on every product filename: <prefix>_<dirname>_detSCA05.fits.
# Default: the element name ("grism" / "prism"). Set explicitly to pin a
# different tag (e.g. output_prefix: grism to mimic historical prism-branch
# naming). wrap_with_romanisim.py globs both element prefixes by default;
# pass it --prefix when overriding this.
# output_prefix: grism

# -- Detectors ---------------------------------------------------------------
# Which SCAs to simulate.  Use "all" for 1-18, or list specific numbers.
scas: all
# scas: [1, 5, 12]

# -- Source selection --------------------------------------------------------
# Initial cone search radius around the pointing center (degrees).
cone_radius: 0.6

# -- Batching ----------------------------------------------------------------
# Stars per JIT batch (larger = more GPU memory, less loop overhead).
star_batch_size: 1000

# Galaxies per JIT batch (smaller than stars due to larger per-source memory).
galaxy_batch_size: 100

# Sersic image size in native pixels.  Oversampled size = galaxy_npix * oversample.
# 30 native pixels = 120 oversampled pixels at 4x oversampling.
galaxy_npix: 30

# -- JAX compilation cache (optional) ----------------------------------------
# Directory for JAX's persistent compilation cache.  Defaults to
# /tmp/jax-cache-grism (cleared on reboot).  Set to a persistent path to
# keep compiled functions across reboots.  CLI --cache-dir overrides this.
# cache_dir: /tmp/jax-cache-grism

# -- Data paths -----------------------------------------------------------
# With element: prism the per-element defaults are the prism ones
# (Roman_prism_OpticalModel_v0.8.yaml, data/sensitivities_prism).
#
# catalog_dir is the exception and usually MUST be set for prism runs: the
# vendored catalog-v2 is on the grism 9000-21000 A grid, and the prism band
# opens at 7500 A — the pipeline raises rather than dispersing a spectrum
# with no blue-end SED support.  Point at a 7500 A-floor catalog (build one
# with scripts/build_source_catalog.py, whose default grid now covers both
# elements) until a catalog-v3 release exists.  See docs/element_support.md.
catalog_dir: /path/to/7500A-floor/catalogs

# Uncomment to override the per-element defaults:
# sensitivity_dir: data/sensitivities_prism
# optical_model: data/Roman_prism_OpticalModel_v0.8.yaml
# psf_cache_dir: data/psf_cache
