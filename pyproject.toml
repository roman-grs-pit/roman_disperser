[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roman_disperser"
version = "0.14.3"
requires-python = ">=3.12"
authors = [
    { name = "Nikhil Padmanabhan", email = "nikhil.padmanabhan@gmail.com" },
]
description = "JAX-based optical model and disperser for Roman Space Telescope slitless spectroscopy (G150 grism and P127 prism)"
dependencies = [
    "numpy>=2.0",
    # jax 0.11.0 excluded: GPU scatter-add regression makes the deposit step
    # ~16x slower; measured gone in 0.11.1 (PR #31). jaxlib carries the same
    # exclusion because the regression could live in either component and
    # jax's own metadata may allow jaxlib 0.11.0 under a newer jax. No floor
    # on jaxlib: jax's metadata pins the compatible range.
    "jax>=0.7,!=0.11.0",
    "jaxlib!=0.11.0",
    "scipy",
    "pyyaml",
    "matplotlib>=3.10",
    "pandas>=2.3.3,<3",
    "pyarrow",
    "zarr",
]

[project.optional-dependencies]
full = [
    "astropy>=7.2.0,<8",
    "tqdm",
    "synphot>=1.6.1,<2",
    "pytest>=9.0.2,<10",
]

[project.scripts]
roman-disperser-hydrate = "roman_disperser.hydrate:main"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (STPSF PSF generation; the production-sampling golden-frame tier)",
    "stpsf: marks tests that require STPSF library",
]
filterwarnings = [
    "ignore:The 'warn' method is deprecated:DeprecationWarning:stpsf",
]
