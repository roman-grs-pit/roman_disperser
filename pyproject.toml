[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roman_disperser"
version = "0.15.1"
requires-python = ">=3.12"
authors = [
    { name = "Nikhil Padmanabhan", email = "nikhil.padmanabhan@gmail.com" },
]
description = "JAX-based optical model and disperser for Roman Space Telescope slitless spectroscopy (G150 grism and P127 prism)"
dependencies = [
    "numpy>=2.0",
    # jax/jaxlib 0.11.2 is the production version from v0.16.0; the
    # golden-frames-v3 references are rendered with it. Hard floor so every install matches the reference
    # products: older jax gives different boundary pixels on dense frames.
    # Older versions we avoid anyway: 0.11.0 (GPU scatter-add ~16x slower,
    # PR #31) and 0.10.x (conda-forge 0.10.2 ~2.2x slower on A10G and
    # segfaults compiling the CPU golden tests; research log, thread
    # xmm-scale-perf, 2026-10-12). <0.12: 0.12 is untested; lift the cap
    # only after the golden + perf gates pass on it.
    "jax>=0.11.2,<0.12",
    "jaxlib>=0.11.2,<0.12",
    "scipy",
    "pyyaml",
    "matplotlib>=3.10",
    "pandas>=2.3.3,<3",
    "pyarrow",
    "zarr",
]

[project.optional-dependencies]
full = [
    "astropy>=7.2.0,<8",
    "tqdm",
    "synphot>=1.6.1,<2",
    "pytest>=9.0.2,<10",
]

[project.scripts]
roman-disperser-hydrate = "roman_disperser.hydrate:main"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (STPSF PSF generation; the production-sampling golden-frame tier)",
    "stpsf: marks tests that require STPSF library",
]
filterwarnings = [
    "ignore:The 'warn' method is deprecated:DeprecationWarning:stpsf",
]
